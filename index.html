<meta charset="UTF-8">
<title>人工智慧應用與技術備課大綱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: light;
    --surface:     #f9f9f7;
    --card:        #fcfcfb;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --ink-muted:   #898781;
    --hairline:    #e1e0d9;
    --border:      rgba(11,11,11,0.10);
    --accent-ring: #c23a3a;
    --accent-bg:   #fbeceb;

    /* 8 個分類色 slot——固定順序使用（cat.key = "c1","c2"...），不要重排。
       課程大類數量若超過 8，額外的類別要自己再加 c9、c10... 並補齊 tint／dark。 */
    --c1: #2a78d6; --c1-tint: #eaf1fb;
    --c2: #d1592a; --c2-tint: #fbeee7;
    --c3: #14966a; --c3-tint: #e7f5ef;
    --c4: #b8860a; --c4-tint: #faf3df;
    --c5: #c14a78; --c5-tint: #fbedf2;
    --c6: #2f7a2f; --c6-tint: #edf5ec;
    --c7: #5b4ea3; --c7-tint: #eeecf9;
    --c8: #4d6b80; --c8-tint: #eaf0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface:     #0d0d0d;
      --card:        #1a1a19;
      --ink:         #ffffff;
      --ink-2:       #c3c2b7;
      --ink-muted:   #898781;
      --hairline:    #2c2c2a;
      --border:      rgba(255,255,255,0.12);
      --accent-ring: #e66767;
      --accent-bg:   #2a1615;

      --c1: #3987e5; --c1-tint: #14202f;
      --c2: #d95926; --c2-tint: #2a1c10;
      --c3: #199e70; --c3-tint: #0f2620;
      --c4: #c98500; --c4-tint: #2a2110;
      --c5: #d55181; --c5-tint: #2a151e;
      --c6: #3fb53f; --c6-tint: #142616;
      --c7: #9085e9; --c7-tint: #1c1930;
      --c8: #8fa3b8; --c8-tint: #16222a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface:     #0d0d0d;
    --card:        #1a1a19;
    --ink:         #ffffff;
    --ink-2:       #c3c2b7;
    --ink-muted:   #898781;
    --hairline:    #2c2c2a;
    --border:      rgba(255,255,255,0.12);
    --accent-ring: #e66767;
    --accent-bg:   #2a1615;

    --c1: #3987e5; --c1-tint: #14202f;
    --c2: #d95926; --c2-tint: #2a1c10;
    --c3: #199e70; --c3-tint: #0f2620;
    --c4: #c98500; --c4-tint: #2a2110;
    --c5: #d55181; --c5-tint: #2a151e;
    --c6: #3fb53f; --c6-tint: #142616;
    --c7: #9085e9; --c7-tint: #1c1930;
    --c8: #8fa3b8; --c8-tint: #16222a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  h1, h2, h3 { font-family: "Noto Serif TC", "Noto Sans TC", serif; }

  a { color: inherit; }

  /* ---------- Top bar ---------- */
  #topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in oklab, var(--card) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--hairline);
  }
  .topbar-inner {
    max-width: 980px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; gap: 1px; margin-right: 6px; }
  .brand .name { font-size: 15px; font-weight: 900; font-family: "Noto Serif TC", serif; }
  .brand .sub { font-size: 11px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

  .search-wrap { position: relative; flex: 1 1 180px; min-width: 140px; max-width: 260px; }
  .search-wrap input {
    width: 100%;
    padding: 7px 12px 7px 30px;
    border-radius: 8px;
    border: 1px solid var(--hairline);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }
  .search-wrap input:focus { border-color: var(--c1); }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); opacity: 0.5; pointer-events: none; }

  .toolbtn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--hairline);
    background: var(--surface); color: var(--ink-2);
    font-family: inherit; font-size: 12.5px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
  }
  .toolbtn:hover { border-color: var(--ink-muted); color: var(--ink); }
  .toolbtn.active { background: var(--accent-bg); border-color: var(--accent-ring); color: var(--accent-ring); }

  .jumpnav { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .jumpchip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 9px; border-radius: 999px;
    border: 1px solid var(--hairline);
    background: var(--surface);
    font-family: inherit;
    font-size: 11.5px; font-weight: 700;
    text-decoration: none;
    color: var(--ink-2);
    white-space: nowrap;
    cursor: pointer;
  }
  .jumpchip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .jumpchip:hover { border-color: var(--ink-muted); color: var(--ink); }
  .jumpchip.active { background: var(--ink); border-color: var(--ink); color: var(--card); }
  .jumpchip.active .dot { outline: 2px solid var(--card); outline-offset: 1px; }

  /* ---------- Page ---------- */
  #page { max-width: 980px; margin: 0 auto; padding: 28px 24px 80px; }

  .hero { margin-bottom: 26px; }
  .hero .eyebrow {
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-muted); margin-bottom: 8px;
  }
  .hero h1 { font-size: 26px; font-weight: 900; margin: 0 0 8px; line-height: 1.3; text-wrap: balance; }
  .hero p { font-size: 14px; color: var(--ink-2); line-height: 1.8; max-width: 62ch; margin: 0; }

  /* ---------- Weight table ---------- */
  .plan-table {
    margin-top: 22px;
    border: 1px solid var(--hairline);
    border-radius: 12px;
    overflow: hidden;
    background: var(--card);
  }
  .plan-row {
    display: grid;
    grid-template-columns: 22px 1.4fr 62px 78px 62px 58px 78px;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid var(--hairline);
    font-size: 12.5px;
    text-decoration: none;
    color: var(--ink);
  }
  .plan-row:first-child { border-top: none; background: color-mix(in oklab, var(--ink) 4%, var(--card)); font-weight: 700; color: var(--ink-muted); font-size: 11px; letter-spacing: .03em; }
  .plan-row:not(:first-child):hover { background: color-mix(in oklab, var(--ink) 3%, var(--card)); }
  .plan-row .dot { width: 10px; height: 10px; border-radius: 50%; }
  .plan-row .name { font-weight: 700; }
  .plan-row .num { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-2); }
  .plan-row .hours-cell { font-weight: 700; color: var(--ink); }
  .plan-row:first-child .hours-cell { font-weight: 700; color: var(--ink-muted); }
  .weightbar { grid-column: 1 / -1; height: 6px; border-radius: 4px; background: var(--hairline); overflow: hidden; margin: 0 16px 12px; display: flex; }
  .weightbar span { height: 100%; }

  .hours-wrap {
    display: flex; align-items: center; gap: 8px;
    margin: 18px 0 -6px;
    font-size: 12.5px; color: var(--ink-2);
  }
  .hours-wrap input {
    width: 64px;
    padding: 5px 8px;
    border-radius: 7px;
    border: 1px solid var(--hairline);
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  .hours-wrap input:focus { outline: none; border-color: var(--c1); }

  /* ---------- Unit sections ---------- */
  .unit {
    margin-top: 44px;
    scroll-margin-top: 84px;
  }
  .unit-head {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding-bottom: 14px; margin-bottom: 18px;
    border-bottom: 3px solid var(--u-color);
  }
  .unit-head .idx {
    font-family: "Noto Serif TC", serif;
    font-size: 13px; font-weight: 700; color: var(--u-color);
    border: 1.5px solid var(--u-color); border-radius: 50%;
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  .unit-head h2 { font-size: 20px; font-weight: 900; margin: 0; flex: 1 1 auto; min-width: 200px; }
  .unit-meta { font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .unit-copy {
    border: 1px solid var(--hairline); background: var(--card); color: var(--ink-2);
    border-radius: 7px; padding: 5px 10px; font-size: 11.5px; cursor: pointer; font-family: inherit;
  }
  .unit-copy:hover { border-color: var(--u-color); color: var(--u-color); }

  .subgrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .unit.single .subgrid { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 900px) { .unit.single .subgrid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px) { .subgrid, .unit.single .subgrid { grid-template-columns: 1fr; } }

  .back-to-overview {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-muted);
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
    padding: 0 0 16px;
  }
  .back-to-overview:hover { color: var(--ink); }
  body.tab-single .back-to-overview { display: inline-flex; }
  body.tab-single #plan-table, body.tab-single .hero, body.tab-single .hours-wrap { display: none; }

  .subcard {
    background: var(--u-tint);
    border: 1px solid color-mix(in oklab, var(--u-color) 30%, var(--hairline));
    border-radius: 12px;
    padding: 14px 16px;
  }
  .subcard h3 {
    font-size: 13.5px; font-weight: 700; margin: 0 0 10px;
    color: var(--ink);
    font-family: "Noto Sans TC", sans-serif;
  }
  .subcard ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .subcard li { font-size: 12.5px; line-height: 1.6; color: var(--ink-2); }
  .subcard li b { color: var(--ink); font-weight: 700; }
  .subcard li .star { color: var(--accent-ring); margin-right: 2px; }
  .subcard li.hot { background: var(--accent-bg); margin: 0 -8px; padding: 4px 8px; border-radius: 6px; }

  .pt-row { position: relative; }
  .subcard li.expandable { cursor: pointer; }
  .subcard li.expandable:hover .pt-row { background: color-mix(in oklab, var(--u-color) 8%, transparent); }
  .subcard li.expandable:focus-visible { outline: 2px solid var(--u-color); outline-offset: 2px; border-radius: 5px; }
  .subcard li.expandable .pt-row {
    padding: 2px 44px 2px 4px;
    margin: -2px -4px;
    border-radius: 6px;
  }
  .expand-mark {
    position: absolute; right: 0; top: 50%;
    transform: translateY(-50%);
    display: inline-flex; align-items: center; gap: 3px;
    color: var(--u-color);
    background: color-mix(in oklab, var(--u-color) 14%, transparent);
    border-radius: 999px;
    padding: 1px 7px 1px 6px;
    font-size: 10px;
    font-weight: 700;
    white-space: nowrap;
  }
  .expand-mark .chev { display: inline-block; transition: transform 0.15s ease; }
  .subcard li.expanded .expand-mark .chev { transform: rotate(180deg); }

  .subcard li .sub-terms {
    list-style: none;
    margin: 8px 0 0;
    padding: 8px 0 2px 12px;
    border-left: 2px solid color-mix(in oklab, var(--u-color) 45%, var(--hairline));
    display: none;
    flex-direction: column;
    gap: 6px;
  }
  .subcard li.expanded .sub-terms { display: flex; }
  .subcard .sub-terms li { font-size: 12px; color: var(--ink-2); cursor: default; }
  .subcard .sub-terms li b { color: var(--u-color); font-weight: 700; }

  @media (prefers-reduced-motion: no-preference) {
    .expand-mark { transition: transform 0.15s ease; }
  }

  li.pt-dim { opacity: 0.28; }
  li.pt-match { outline: 2px solid var(--c1); outline-offset: 2px; border-radius: 5px; }

  #no-results { display: none; text-align: center; color: var(--ink-muted); font-size: 13px; padding: 60px 0; }

  footer {
    max-width: 980px; margin: 40px auto 0; padding: 20px 24px 40px;
    border-top: 1px solid var(--hairline);
    font-size: 11.5px; color: var(--ink-muted); line-height: 1.9;
  }

  @media print {
    #topbar { position: static; }
    .jumpnav, .search-wrap, #btn-hot, #btn-copyall, .unit-copy, #btn-expand-terms, .hours-wrap { display: none !important; }
    .expand-mark { display: none !important; }
    .subcard li .sub-terms { display: flex !important; }
    body { background: #fff; color: #000; }
    body.tab-single #plan-table, body.tab-single .hero, body.tab-single .hours-wrap { display: none; }
  }

  @media (max-width: 860px) {
    .legend { margin-left: 0; }
  }
</style>

<div id="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="name" id="brand-name">備課大綱</div>
      <div class="sub" id="stat-line">載入中…</div>
    </div>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="搜尋知識點、專有名詞…" autocomplete="off">
    </div>
    <button class="toolbtn" id="btn-hot">★ 只看易混淆重點</button>
    <button class="toolbtn" id="btn-expand-terms">▾ 展開全部名詞說明</button>
    <button class="toolbtn" id="btn-copyall">複製全部大綱</button>
    <nav class="jumpnav" id="jumpnav"></nav>
  </div>
</div>

<div id="disclaimer-banner" style="background:var(--accent-bg);border-bottom:1px solid var(--accent-ring);padding:9px 24px;text-align:center;font-size:12.5px;color:var(--ink-2);line-height:1.6;">
  公告聲明：額外輔助教材內容僅為參考，實際內容以雲端練功坊為主　<a href="https://cloud.csf.org.tw/" target="_blank" rel="noopener" style="color:var(--accent-ring);font-weight:700;">前往雲端練功坊 →</a>
</div>

<div id="page">
  <button class="back-to-overview" id="btn-back">← 回總覽</button>
  <div class="hero">
    <div class="eyebrow" id="hero-eyebrow">備課參考</div>
    <h1 id="hero-title">把題庫整理成可以直接拿去排課的大綱</h1>
    <p id="hero-desc"></p>
  </div>

  <div class="hours-wrap">
    <label for="hours-input">總授課時數</label>
    <input type="number" id="hours-input" min="0" step="0.5" placeholder="例如 18">
    <span>小時 → 下表自動換算各單元建議時數</span>
  </div>
  <div class="plan-table" id="plan-table"></div>

  <div id="units"></div>
  <div id="no-results">沒有符合「<span id="no-results-q"></span>」的知識點</div>

  <footer id="page-footer"></footer>
</div>

<script>
(function () {
  "use strict";

  // =================================================================
  // 1) CONFIG — 每個課程只需要改這裡 + 下面的 DATA，其他都是共用邏輯
  // =================================================================
  var CONFIG = {
    pageTitle: "人工智慧應用與技術備課大綱",
    courseName: "【TQC】人工智慧應用與技術-專業級",
    courseCode: "人工智慧應用與技術-專業級",
    heroTitle: null,
    heroDesc: null,
    sourceNote: "CSF 雲端練功坊「人工智慧應用與技術-專業級」練習題庫"
  };

  // =================================================================
  // 2) DATA — 課程知識點內容，照這個 schema 填
  // =================================================================
  //
  // DATA = [ category, category, ... ]   // 大類，對應網站「特定領域練習」清單
  //
  // category = {
  //   name:  "大類全名",
  //   short: "大類簡稱（4字內，給分頁按鈕用，避免自動截字切到一半）",
  //   count: 62,          // 這個大類的實際題數（跟 export_questions.py discover 出來的一致）
  //   key:   "c1",        // c1~c8，依序用，不要跳號、不要重複（用來對應 CSS 顏色 slot）
  //   subtopics: [ subtopic, subtopic, ... ]
  // }
  //
  // subtopic = {
  //   name: "子主題名稱",
  //   points: [ point, point, ... ]
  // }
  //
  // point = [ label, desc, hot, terms? ]
  //   label : string   — 知識點標籤，8~15字內，適合當卡片粗體標題
  //   desc  : string   — 一句話完整說明（含考點方向、易混淆提醒）
  //   hot   : 0 | 1     — 1 = 題庫裡明確標示為易混淆／高頻考點，卡片會標★＋紅框
  //   terms : 可省略。當這個知識點其實是「一句話塞好幾個專有名詞」時
  //           （例如「PPC/CPC vs CPM vs CPA/CPS」），把每個名詞拆開列成
  //           [[術語, 完整解釋], [術語, 完整解釋], ...]，頁面上會變成可
  //           點擊展開的清單。判斷標準：desc 裡如果出現 2 個以上帶自己
  //           定義的縮寫/專有名詞，就該拆成 terms，不要全部塞在一句話裡。
  //
  // === 品質要求（做完一定要做，不要省略）===
  // A. 每個 category 的 points 要「逐題比對過原始 PDF 題目全文」，不能只憑
  //    子主題標題腦補。摘要時最容易漏掉的是：選擇題裡「正確答案以外的
  //    干擾選項」也常是獨立考點（例如 CNN/RNN/LSTM 對比題，正解只提
  //    CNN vs RNN，但 GAN、Transformer 當幹擾選項也會被學生考到）。
  // B. 建議流程：先用 fork 逐大類讀 PDF 文字整理出知識架構 → 再用第二輪
  //    fork「稽核」比對「知識架構」跟「原始題目全文」找遺漏 → 把遺漏補
  //    進 DATA。兩輪都做，不要只做第一輪就上線。詳細步驟見同資料夾
  //    「製作流程.md」。
  // C. count（大類題數）跟 export_questions.py discover 出來的數字要一致，
  //    不要用「points.length」湊數——points 是知識點數，不是題數。

  var DATA = [
    {
      name: "AI發展歷程與生態系", short: "發展歷程", count: 36, key: "c1",
      subtopics: [
        { name: "AI發展史與智慧分級", points: [
          ["圖靈測試定義AI智慧","1950年代圖靈（Turing）提出的AI智慧判斷法：若機器行為讓人無法辨識其身分，即視為具有智慧，是AI領域最早的智慧測試標準。",0],
          ["專家系統的知識庫架構","1980年代盛行的AI程式，具備知識庫與推論機，依特定領域的邏輯規則回答或解決問題，代表案例為MYCIN血液傳染病診斷系統。",0],
          ["強AI與弱AI的定義差異","弱人工智慧僅模仿人類特定能力（如物體辨識、語音辨識），不需完整認知能力；強人工智慧（通用人工智慧）追求與人類相同的推理思考解決問題能力，是AI研究的終極目標，兩者常被拿來互相混淆考。",1,[["弱人工智慧（Weak AI）","模仿人類特定能力，如物體辨識、語音辨識，不具備完整人類認知能力"],["強人工智慧（Strong AI／通用人工智慧）","與人類具有相同的推理、思考、解決問題能力，是AI學者的終極目標"]]],
          ["AI寒冬的技術瓶頸成因","1970年代AI首次遇到瓶頸，原因是基礎理論不完備、計算複雜度呈指數成長、硬體運算能力不足，並非倫理道德疑慮——這是後期才出現的AI爭議，常被誤認為早期瓶頸原因。",1],
          ["AI方法典範轉移：規則到統計","1986年倒傳遞演算法（Backward Propagation）重新發明為分水嶺，之後AI主流方法從早期「基於規則」的專家系統邏輯，轉為「基於統計」——直接從大量資料訓練模型找出規律，不需人工設計規則。",1,[["基於規則（Rule-based）","將人類思維邏輯轉換成規則教給電腦的早期AI方法"],["基於統計（Statistical-based）","在大量資料集中訓練模型讓電腦自己找出規律，為現代AI主流方法"]]],

        { name: "AI蓬勃發展的驅動技術", points: [

          ["大數據系統支援資料處理","大數據系統提供高效率運算大量資料的平台，讓蒐集到的巨量原始資料得以被觀察與處理，是機器學習訓練資料處理的關鍵基礎。",0],
          ["AI計算技術三大分支","機器學習、演化計算、資料探勘都屬於AI領域知名的計算技術分支；雲端運算則屬於支援性基礎架構，不算AI核心計算技術，此題易把支援技術誤認為AI技術本身。",1,[["機器學習（Machine Learning）","從資料中自動學習規律的AI技術分支"],["演化計算（Evolutionary Computation）","模擬生物演化機制（如基因演算法）求解問題的AI技術分支"],["資料探勘（Data Mining）","從大量資料中挖掘隱藏規律與知識的技術"]]],
          ["GPU/TPU加速深度學習佈建","深度學習需要大量矩陣運算，GPU與Google專為深度學習開發的TPU等專用硬體，是讓深度學習模型能廣泛佈建於各領域的關鍵技術。",0,[["GPU（Graphics Processing Unit）","支援平行矩陣運算的繪圖處理器，廣泛用於深度學習訓練"],["TPU（Tensor Processing Unit）","Google專為深度學習開發的張量運算加速晶片"]]],

        { name: "雲端運算服務與部署模式", points: [
          ["雲端服務三層模型IaaS/PaaS/SaaS","依服務抽象層級分為IaaS（基礎設施，如Amazon EC2租用虛擬主機）、PaaS（平台，如Google App Engine免維護伺服器直接上傳程式）、SaaS（軟體，如Google文件協作終端使用者直接用軟體），三者提供的管理責任層級不同，是雲端服務題型的核心易混淆考點。",1,[["IaaS（Infrastructure as a Service）","提供基礎設施（主機、網路、儲存）租用服務，例：Amazon EC2"],["PaaS（Platform as a Service）","提供開發平台，開發者上傳程式即可運行不需維護伺服器，例：Google App Engine"],["SaaS（Software as a Service）","提供終端使用者直接使用的軟體服務，例：Google線上文件協作"]]],
          ["雲端四種部署模式","依服務對象與所有權分為公有雲（如GCP對大眾開放）、私有雲（如學校自建機房僅服務內部）、社群雲（服務特定社群共享，題庫中從未當過正解、只作干擾選項）、混合雲（結合公有與私有雲以應付流量需求），是雲端架構考題的高頻混淆點。",1,[["公有雲（Public Cloud）","雲端服務廠商對大眾或企業集團開放的服務，如GCP"],["私有雲（Private Cloud）","僅服務單一組織的雲端架構，可自行或委外管理"],["社群雲（Community Cloud）","服務特定社群共享的雲端架構，題庫中常見的干擾選項"],["混合雲（Hybrid Cloud）","結合兩個以上獨立雲端架構並整合技術，兼具彈性與可攜性"]]],
          ["虛擬化技術彈性分配資源","虛擬化技術將實體資源（CPU、硬碟、記憶體、伺服器）轉化後動態彈性配置給使用者，打破實體結構不可切割的限制，是雲端運算能依需求彈性配置資源的核心技術。",0],
          ["容器與虛擬化技術的差異","容器技術比傳統虛擬化更輕薄短小、效能導向，代表技術有Docker（帶動容器化風潮）、Kubernetes（Google開發）、Amazon ECS（Amazon開發）；Spark屬於大數據運算技術而非容器技術，是本類常見的混淆干擾選項。",1,[["Docker","將容器技術帶入主流的代表工具"],["Kubernetes","Google開發的容器調度／編排技術"],["Amazon ECS","Amazon開發的容器管理服務"]]],

        { name: "大數據技術與NoSQL", points: [
          ["大數據4V特性","大數據常以4V描述特性：Volume（資料量龐大難儲存，如Facebook每日130TB log）、Velocity（產生速度快難即時處理，如Google每秒4萬次查詢）、Variety（資料種類多元，如Instagram文字/照片/影片並存）、Veracity（資料真實性/品質，題庫未直接考出但仍是4V完整定義的一環，容易被遺漏），是大數據題型必考的基礎架構。",1,[["Volume","資料量龐大到難以儲存與處理"],["Velocity","資料產生速度快，難以即時處理"],["Variety","資料型態種類多元，需新型資料庫因應"],["Veracity","資料的真實性與品質，4V定義中易被忽略但仍應掌握的一項"]]],
          ["訊息佇列作為資料收集中介","訊息佇列是收集資料與處理資料之間的中介系統，常見技術有Kafka、RabbitMQ、Google PubSub；Amazon EC2是虛擬化主機服務而非訊息佇列，是常見混淆的干擾選項。",1,[["Kafka","分散式訊息佇列系統"],["RabbitMQ","訊息佇列中介軟體"],["Google PubSub","Google的發布／訂閱訊息服務"]]],
          ["批次處理與即時處理效能指標","大數據系統依需求分為批次處理（如Hadoop MapReduce）與即時處理（如Apache Storm、Spark-Streaming）；批次系統著重高吞吐量與規模化處理能力，低延遲則是即時系統才需要的效能指標，是常考的混淆點。",1,[["批次處理（Batch Processing）","定期處理大量累積資料，如Hadoop MapReduce，重視高吞吐量"],["即時處理（Stream Processing）","即時處理持續產生的資料，如Apache Storm、Spark-Streaming，重視低延遲"]]],
          ["NoSQL與關聯式資料庫的區別","關聯式資料庫（如MariaDB）適合小規模高頻讀寫或大批次少存取的結構化資料，處理大數據效能不佳；NoSQL不需固定表格模式（Schema-less）且具高度延展性，是為解決大數據處理問題而生。",0],
          ["四種NoSQL資料庫的應用選擇","依應用場景選用不同NoSQL：Neo4j（圖形資料庫，適合社交關係如LinkedIn Connection）、MongoDB（文件資料庫，適合半結構化內容如部落格圖文貼文）、Redis（in-memory資料庫，適合低延遲需求如線上遊戲即時互動，缺點是未持久化時關機會遺失資料）、HBase（Key-Value資料庫，取消固定Schema，適合大量獨立資料如120TB電子郵件儲存），是本類別最容易搞混的高頻考點。",1,[["Neo4j","圖形（Graph）資料庫，儲存節點間關係，適合社交網路連結"],["MongoDB","文件型資料庫，儲存半結構化文件，適合圖文並存的內容"],["Redis","in-memory資料庫，讀寫速度快、常作快取，未持久化則關機遺失資料"],["HBase","Key-Value型NoSQL，取消固定Schema，具高擴充與分散式特性"]]],
        ]},

          ["企業參與AI的四種角度","企業投入AI產業可分四種角度：AI平台供應者（將AI技術包裝成服務供他人使用，如Microsoft認知服務API、Appier Axion決策平台）、AI內容供應者（提供AI學習資源，如Google的Machine Learning Crash Course）、AI+（以AI衍生全新產業，如Amazon Alexa語音助理、自駕車）、+AI（既有行業導入AI提升表現，如新漢清大咖啡豆瑕疵檢測、中山醫大肺炎診斷模型），四者定義相近極易混淆，是本類別最高頻考點。",1,[["AI平台供應者","將AI技術包裝成服務或API供他人使用，降低使用門檻，如Microsoft認知服務、Appier Axion"],["AI內容供應者","提供AI相關教材、課程、論壇等學習資源，如Google ML Crash Course"],["AI+","以AI技術衍生出全新型態產業鏈，如Amazon Alexa語音助理、自駕車"],["+AI","既有行業導入AI技術以提升原有表現，如咖啡豆瑕疵檢測、肺炎診斷模型"]]],

          ["電動車節能效益常被高估","智慧城市節能減碳措施常見智慧照明、車輛共乘、智慧調控巴士間距；電動車充電網路雖便利，但因發電、輸配電到充電的多層能源轉換損耗大，能源利用率未必高於傳統機動車輛，未必能達到節能減碳效果，是常見誘答陷阱。",1],

        { name: "樹模型與集成學習", points: [
          ["決策樹的特性","決策樹使用訊息增益(Information Gain，衡量切分後不確定性降低程度的指標)衡量切分點；若不限制樹的深度，最終每個節點的樣本可能都屬於同一類別；具有高可視化與可解釋力，但也因此非常容易過擬合，須搭配限制深度等正規化手段。",1],
          ["決策樹的分裂衡量指標","熵(Entropy)與吉尼係數(Gini Index)都是衡量訊息增益、決定切分點的常用指標；但這兩者本身無法縮短巨量資料集上的訓練時間，真正能明顯縮短訓練時間的做法是降低樹的深度。",1,[["熵 Entropy","衡量資料集不確定性(混亂程度)的指標，值越高越混亂"],["吉尼係數 Gini Index","衡量資料集不純度的另一種指標，計算成本較熵低"]]],
          ["隨機森林的運作原理","隨機森林(Random Forest)是一種集成學習(結合多個模型的預測結果以提升整體表現)的方法，每棵樹使用抽樣而來的不同資料與特徵訓練，因此每次訓練的森林結果可能不同，最終透過多棵樹投票的方式決定預測結果。",1],
          ["隨機森林可調的超參數","隨機森林可調整的超參數包含樹的最大深度、樹的數量、切分準則等，但不具備學習率(Learning Rate)這類梯度優化模型才有的超參數，這些調整都會影響訓練結果。",0],
          ["超參數與參數的區別及搜尋方法","超參數(Hyperparameter)是訓練模型前需人為設定的配置，如樹的深度限制、目標函數定義；參數(Parameter)則是模型訓練完成後習得的權重，如迴歸係數。正確的超參數搜尋應搭配Cross Validation進行，不同資料集的最佳參數配置可能不同。",1,[["超參數 Hyperparameter","訓練前由人工設定、不隨訓練過程更新的設定值"],["參數 Parameter","模型訓練過程中透過資料學習更新的權重值"]]],
          ["Bootstrapping與Boosting的差異","自助抽樣(Bootstrapping)是取後放回的隨機抽樣方式，透過隨機性降低過擬合，是隨機森林的抽樣基礎；Boosting則是根據前一個弱模型的錯誤結果逐步優化，結合多個弱學習器提升整體表現，兩者都是集成學習的實現方式。",1,[["Bootstrapping 自助抽樣","以取後放回方式重複抽樣建立訓練子集的技術"],["Boosting","依序訓練多個弱模型、每次聚焦於前一模型錯誤之處逐步優化的集成方法"]]],
          ["梯度提升機的核心概念","梯度提升機(Gradient Boosting Machine, GBM)每次生成的弱學習器(Weak Learner)都以最小化先前模型所帶來的損失為目標，可用於迴歸與分類問題，弱學習器之間並非彼此無關，而是有前後依賴、逐步修正的關係。",1,[["GBM 梯度提升機","依序疊加弱學習器、每次針對前一模型殘差進行擬合的集成學習方法"],["弱學習器 Weak Learner","預測能力略優於隨機猜測的簡單模型，集成學習透過結合多個弱學習器提升整體表現"]]],
          ["不均衡樣本的處理方式","處理類別不均衡問題(如詐騙偵測、瑕疵檢測)可採用對少數類別過抽樣(Oversampling)、對多數類別低抽樣(Undersampling)、或在目標函數中提高少數類別樣本的損失權重；但維度縮減(Dimension Reduction)是針對特徵降維，無法解決類別不均衡問題。",1,[["過抽樣 Oversampling","增加少數類別樣本數量以平衡類別比例的技術"],["低抽樣 Undersampling","減少多數類別樣本數量以平衡類別比例的技術"]]],
          ["機器學習的定義","機器學習是透過大量訓練資料，讓機器自動從資料中學習出規則，而非依靠人工撰寫程式碼告訴機器規則；這點也與著重繪圖、整理等方式探索資料價值的「資料探勘」有所不同。",0],
        ]},
        { name: "監督式/無監督式學習與降維聚類", points: [
          ["主成分分析PCA","主成分分析(PCA)使用前需先對資料做正規化，可將資料降至任意維度(至少一維)；降維後仍可透過視覺化觀察分群特性、具參考價值，但降維後的特徵通常難以直接對應原始意義而較難解釋。",1],
          ["K-means分群法的限制","K-means需自行設定分群數K，可用歐式距離衡量組內距離，起始點的選取有多種方式；但其目標函數是NP-hard最優化問題，目前的優化方式並不能保證找到全域最佳解。",1,[["K-means","將資料分成K群、反覆迭代更新群中心以最小化組內距離的分群演算法"],["NP-hard","計算複雜度理論中，目前沒有已知多項式時間演算法可求得最優解的問題類別"]]],
          ["SVM欠擬合的改善方式","支持向量機(SVM)發生欠擬合(Underfitting)時，可透過增加懲罰參數C的值來改善；C值越大代表模型越不容忍訓練誤差、會試著將所有樣本分類正確，但也代表越容易過擬合。",1,[["SVM 支持向量機","尋找最大間隔超平面以分離不同類別資料的監督式學習演算法"],["懲罰參數 C","SVM中控制誤差容忍度與間隔寬度取捨的超參數"]]],
          ["監督式與無監督式學習的比較","目前市場上以監督式學習應用較為廣泛，需要已完整標記的資料；無監督式學習雖不需要標記資料，但仍需要資料才能訓練、且演算法一樣有目標函數進行優化。",1,[["監督式學習 Supervised Learning","使用已標記答案的資料訓練模型的學習方式"],["無監督式學習 Unsupervised Learning","使用未標記資料、由模型自行找出資料內在結構的學習方式"]]],
          ["演算法對非線性資料的適應力","面對高度非線性且變數極多的資料集，決策樹等非線性模型通常比線性迴歸、多項式迴歸等線性模型更能擬合資料型態、取得較好的表現。",0],
          ["無監督式學習的常見模型","階層式分群法(Hierarchical Clustering)是常見的無監督式學習模型；支持向量機與決策樹屬於監督式學習演算法，條件隨機域(Conditional Random Field)則屬於機率化模型，三者不能與無監督式學習混淆。",1,[["階層式分群法 Hierarchical Clustering","不需預先設定群數、以樹狀結構逐步合併或分裂群集的分群方法"],["條件隨機域 CRF","對序列標記問題建模的機率圖模型"]]],
          ["降維演算法的比較","奇異值分解(SVD)、主成分分析(PCA)、自編碼器(Autoencoder)都能對高維資料進行降維；脊迴歸(Ridge Regression)是迴歸模型的正則化方法，並不具備降維能力。",1,[["奇異值分解 SVD","將矩陣分解為多個特徵矩陣乘積、可用於降維與資料壓縮的線性代數方法"],["脊迴歸 Ridge Regression","在損失函數加入L2懲罰項以縮小係數、緩解過擬合的線性迴歸方法"]]],
          ["正則化與特徵選取","L1正規化(Lasso)偏向使特徵係數稀疏化，能有效去除無用特徵並達到特徵選取的效果；L2正規化(Ridge)則避免模型參數過於複雜、有效減緩過擬合；兩者皆是針對模型參數(而非訓練資料本身)進行處理，且可以同時使用。",1,[["L1正則化 Lasso","在損失函數加入係數絕對值懲罰項，使部分係數趨近於零、具特徵選取效果的正則化方法"],["L2正則化 Ridge","在損失函數加入係數平方懲罰項，讓權重整體變小、避免模型過度複雜的正則化方法"]]],
        ]},
        { name: "類神經網路訓練基礎", points: [
          ["梯度下降法的更新方向","梯度下降法(Gradient Descent)透過往目標函數對參數偏微分(dL/dx)切線的反方向更新參數，並不保證能找到目標函數的全域極小值，若更新步長過大，損失值甚至可能因跳動而增加、不一定隨迭代單調下降。",1],
          ["損失函數與問題類型的對應","二元分類問題應搭配二元交叉熵(Binary Cross-Entropy)作為損失函數，而非類別交叉熵(Categorical Cross-Entropy，用於多類別分類)；迴歸問題則常搭配均方誤差(Mean Square Error, MSE)。",1,[["二元交叉熵 Binary Cross-Entropy","衡量二元分類預測機率與真實標籤差距的損失函數"],["類別交叉熵 Categorical Cross-Entropy","衡量多類別分類預測機率分布與真實標籤差距的損失函數"]]],
          ["常見的神經網路優化器","Adam、RMSProp、Nadam都是類神經網路常用的梯度優化器；AdaBoost則是機器學習中的集成學習模型，並非神經網路優化器，兩者不可混淆。",1,[["Adam","結合動量與自適應學習率、目前最常用的神經網路優化器之一"],["AdaBoost","透過調整樣本權重、依序訓練多個弱分類器的集成學習演算法"]]],
          ["全連接層參數量計算","兩個全連接層之間的參數量計算方式為權重參數量(前層神經元數×後層神經元數)加上偏誤參數量(後層神經元數)；例如10個神經元接15個神經元的參數量為10×15+15=165。",0],
          ["神經網路過擬合的解決方法","類神經網路常見的解決過擬合方法包括使用Dropout(訓練時隨機捨棄部分神經元)、加入正則化(Regularizers)、增加訓練資料；但增加訓練時間並無法解決過擬合，反而容易使模型更貼合訓練雜訊。",0],
          ["SGD避免局部最小值的方法","隨機梯度下降法(SGD)可透過在損失函數的切線方向加上動量(Momentum)，幫助跳出局部最小值(Local Minimum)；初始學習率設較小值雖收斂較慢，但有助逐步逼近全域最佳解，動量無法加在啟動函數上。",1,[["SGD 隨機梯度下降","每次僅用一小批樣本估計梯度並更新參數的梯度下降變形"],["動量 Momentum","在參數更新方向累積過去梯度、幫助跳脫局部最小值的技巧"]]],
          ["多GPU訓練的特性與限制","使用GPU訓練通常比CPU快速，當GPU記憶體不足時可降低批量大小(Batch Size)來解決；Multi-GPU訓練雖可加快訓練速度，但因各GPU間需彼此溝通、傳遞梯度更新訊息，訓練速度並不會隨GPU數量呈現線性成長。",0],
          ["深度學習的資料前處理要求","深度學習模型的輸入僅能是數值型態的資料，若原始資料含類別型態(Categorical)特徵，必須先透過One-Hot Encoding(將類別轉換為多維0/1向量的編碼方式)轉換為數值；特徵通常需要正規化，缺失值也須先經過填補才能進行訓練。",0],
          ["深度學習受重視的關鍵因素","類神經網路並非全新技術，早在20世紀中即已出現；近年深度學習受到廣泛重視，主要歸功於能蒐集/取得更大量的資料、硬體運算能力增強、以及在國際圖像辨識大賽等場合取得優異成績。此外，訓練資料的品質與數量都會直接影響模型表現，資料量不足或品質不佳都會使結果變差，訓練損失沒下降時應嘗試調降學習率或調整模型，而非一味增加訓練時間。",1],
        ]},
        { name: "啟動函數與梯度問題", points: [
          ["啟動函數的輸出值域","Sigmoid值域為(0,1)、ReLU為(0,∞)、LeakyReLU為(-∞,∞)、雙曲正切函數(Hyperbolic Tangent, Tanh)為(-1,1)，各啟動函數的輸出範圍不同，會影響其梯度傳遞特性與適用場景。",1,[["Sigmoid","將輸出壓縮至(0,1)區間的S型啟動函數"],["LeakyReLU","ReLU的改良版，允許負值輸入有微小斜率輸出、避免神經元死亡"]]],
          ["梯度彌散與啟動函數選擇","Tanh、Sigmoid、Softsign都會將數值壓縮至特定小範圍，容易造成梯度彌散(Vanishing Gradient，梯度隨層數增加趨近於零、使淺層參數難以更新的現象)；ReLU因正值區間梯度恆為1，較不容易發生梯度彌散現象。",1,[["梯度彌散 Vanishing Gradient","反向傳播時梯度隨層數增加而趨近於零，導致淺層參數難以更新的現象"],["Softsign","將輸出壓縮至(-1,1)區間、梯度變化較Tanh平緩的啟動函數"]]],
          ["RNN的梯度問題與對策","遞迴類神經網路(RNN)克服梯度彌散(Vanishing Gradient)的主要手段是加入長短期記憶單元(LSTM Cell)；克服梯度爆炸(Exploding Gradient)的主要手段則是對梯度使用數值切割(Clip Gradient)，避免訊息在傳遞過程中被無限放大。",1,[["LSTM Cell 長短期記憶單元","透過閘門機制選擇性保留或遺忘訊息、緩解RNN梯度彌散問題的網路單元"],["Clip Gradient 梯度裁剪","將梯度數值限制在固定範圍內，避免梯度爆炸的技術"]]],
          ["批次正規化的特性","批次正規化(Batch Normalization)對各特徵/特徵圖獨立進行正規化；在推論模式(Inference Mode)下使用訓練時累積的移動平均值，與訓練模式(Training Mode)所用統計量不同；Batch Size太小時正規化結果會不穩定。",1,[["批次正規化 Batch Normalization","對每個mini-batch的輸出進行正規化、加速訓練並提升穩定性的技術"],["移動平均 Moving Average","訓練過程中持續更新累積的統計量，供推論階段使用"]]],
          ["權重與偏差的初始值設定","建置神經網路時，權重(Weights)的起始值可正可負，不同起始點會導致最終模型收斂位置不同；若各層權重全部使用同一常數作為起始值，會導致各神經元更新完全相同(對稱性問題)，但各層偏差(Bias)則可以使用統一常數作為起始值。",1,[["權重 Weights","神經網路中連接神經元、決定輸入訊號強度的可學習參數"],["偏差 Bias(神經網路)","神經網路中獨立於輸入、可平移啟動函數輸出的可學習參數"]]],
        ]},
        { name: "CNN與電腦視覺應用", points: [
          ["卷積層輸出尺寸計算","卷積層輸出尺寸公式為(輸入尺寸-過濾器尺寸)/步長+1，深度則等於過濾器數量；例如輸入7×7×3、20個3×3×3過濾器、無填充(No Padding)、步長為2，輸出尺寸為(7-3)/2+1=3，即3×3×20。",0,[["過濾器 Filter","卷積層中在輸入資料上滑動、提取局部特徵的權重矩陣"],["步長 Stride","過濾器每次滑動的距離"]]],
          ["池化層的運作方式","池化層用於降低特徵圖尺寸並保留重要資訊，最大池化(Max Pooling)取窗口內最大值，平均池化(Average Pooling)取窗口內平均值，兩者皆為常見的下採樣手法。",0,[["最大池化 Max Pooling","取局部窗口內最大值作為輸出的池化方式"],["平均池化 Average Pooling","取局部窗口內平均值作為輸出的池化方式"]]],
          ["自編碼器的特性","自編碼器(AutoEncoder)屬於非監督式學習，可用於資料降維，神經網路結構不必對稱，訓練後的參數可遷移(Transfer)到其他任務(如分類問題)，常作為預訓練之用。",1,[["AutoEncoder 自編碼器","透過編碼-解碼架構學習資料壓縮表示、屬於非監督式學習的神經網路"],["遷移 Transfer","將已訓練好的模型參數應用到新任務上的做法"]]],
          ["1x1卷積層的作用","1x1卷積層可用於降低維度、增加運算效率、降低內存消耗，也可用於增加維度(Channels)實現跨維度整合，首次於Inception Network中提出，又稱mlp Convolution layer；為求運算效率通常搭配ReLU作為啟動函數。",1,[["1x1卷積層","卷積核尺寸為1×1、常用於調整通道數與整合跨通道資訊的卷積層"],["Inception Network","首次提出1×1卷積層概念、以多尺度並行卷積結構著稱的CNN架構"]]],
          ["物件偵測常用模型架構","YOLO(You Only Look Once)、R-CNN、Faster R-CNN都是物件偵測常用的深度學習模型架構；Sequence-to-Sequence則常用於文本翻譯與序列生成的遞迴神經網路架構，並非物件偵測模型。",1,[["YOLO","將偵測視為單次回歸問題、速度快的即時物件偵測模型"],["R-CNN / Faster R-CNN","先產生候選區域再分類定位的兩階段物件偵測模型系列"],["Sequence-to-Sequence","將輸入序列轉換為輸出序列、常用於翻譯與生成任務的架構"]]],

  var hoursInput = document.getElementById("hours-input");
  hoursInput.addEventListener("input", function () {
    var total = parseFloat(hoursInput.value);
    var valid = !isNaN(total) && total > 0;
    if (!valid) {
      hoursCells.forEach(function (c) { c.el.textContent = "—"; });
      return;
    }
    // Largest-remainder apportionment in 0.5h slots, so the column always
    // sums exactly to the entered total — rounding each row independently
    // (old approach) can drift the total away from what the teacher typed.
    var totalSlots = Math.max(0, Math.round(total * 2));
    var raw = hoursCells.map(function (c) { return c.fraction * totalSlots; });
    var base = raw.map(Math.floor);
    var used = base.reduce(function (a, b) { return a + b; }, 0);
    var remainder = totalSlots - used;
    var order = raw
      .map(function (v, i) { return { i: i, frac: v - base[i] }; })
      .sort(function (a, b) { return b.frac - a.frac; });
    for (var k = 0; k < remainder && k < order.length; k++) { base[order[k].i]++; }
    hoursCells.forEach(function (c, i) { c.el.textContent = (base[i] * 0.5).toFixed(1) + "h"; });
  });

  // ---------- copy outline ----------
  function outlineText(ci) {
    var cat = DATA[ci];
    var lines = [cat.name + "（" + cat.count + "題）", ""];
    cat.subtopics.forEach(function (sub) {
      lines.push("■ " + sub.name);
      sub.points.forEach(function (p) {
        lines.push("　" + (p[2] ? "★ " : "・") + p[0] + "：" + p[1]);
        if (p[3]) {
          p[3].forEach(function (t) { lines.push("　　- " + t[0] + "：" + t[1]); });
        }
      });
      lines.push("");
    });
    return lines.join("\n");
  }
  function copyText(text, btn) {
    var done = function () {
      var old = btn.textContent;
      btn.textContent = "已複製 ✓";
      setTimeout(function () { btn.textContent = old; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text); done();
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  // ---------- search ----------
  var searchInput = document.getElementById("search");

  function applySearchFilter() {
    var q = searchInput.value.trim().toLowerCase();
    var anyMatch = false;
    var isOverview = currentTab === "overview";

    DATA.forEach(function (cat, i) {
      var unit = document.getElementById("unit-" + i);
      var tabEligible = isOverview || String(i) === String(currentTab);
      if (!tabEligible) return;

      var unitHasMatch = false;
      Array.prototype.forEach.call(unit.querySelectorAll(".subcard"), function (card) {
        var cardHasMatch = false;
        // .pt only — a plain "li" selector would also match the nested
        // <li> inside .sub-terms, which have no data-text and crash .indexOf.
        Array.prototype.forEach.call(card.querySelectorAll("li.pt"), function (li) {
          var isMatch = q && li.getAttribute("data-text").indexOf(q) !== -1;
          li.classList.toggle("pt-match", !!isMatch);
          li.classList.toggle("pt-dim", !!q && !isMatch);
          if (isMatch) {
            cardHasMatch = true;
            anyMatch = true;
            if (li.classList.contains("expandable") && !li.classList.contains("expanded")) {
              li.classList.add("expanded", "auto-expanded");
              li.setAttribute("aria-expanded", "true");
            }
          } else if (li.classList.contains("auto-expanded")) {
            li.classList.remove("expanded", "auto-expanded");
            li.setAttribute("aria-expanded", "false");
          }
        });
        card.style.display = (!q || cardHasMatch) ? "" : "none";
        if (cardHasMatch) unitHasMatch = true;
      });

      if (isOverview) unit.style.display = (!q || unitHasMatch) ? "" : "none";
    });

    document.getElementById("no-results").style.display = (q && !anyMatch) ? "block" : "none";
    document.getElementById("no-results-q").textContent = q;
  }

  searchInput.addEventListener("input", applySearchFilter);

  initTabFromHash();
})();
</script>
